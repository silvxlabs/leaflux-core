name: Release Workflow

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload-to-test-pypi:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: pip
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine --skip-existing dist/*
    - name: Build package
      run: python -m build
    - name: Upload to Test PyPi
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
      run: |
        twine upload --repository testpypi dist/*

  test-on-test-pypi:
    needs: upload-to-test-pypi
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package from Test PyPi
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple leaflux
      - name: Run pytest
        env:
          TEST_ENV: test_pypi
        run: |
          pytest

  upload-to-pypi:
    needs: test-on-test-pypi
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: pip
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine --skip-existing dist/*
    - name: Build and publish
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        python -m build
        twine upload dist/*

  test-on-pypi:
    needs: upload-to-pypi
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package from PyPi
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install leaflux
      - name: Run pytest
        env:
          TEST_ENV: pypi
        run: |
          pytest